<style>

  html,body{margin:0;height:100%;overflow:hidden}
  body{

    font-size:16px;line-height:1.4;display:flex;flex-direction:column;

  #vrh{display:flex;align-items:center;gap:10px;padding:10px 14px 4px}
  #pike{display:flex;gap:5px}
  #pike span{width:7px;height:7px;border-radius:50%;background:var(--rob)}
  #pike span.done{background:var(--crta)}
  #pike span.now{background:var(--dres-obramba);transform:scale(1.35)}
  #izid{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:650;font-size:15px}
  #izid b{color:var(--dres-napad)} #izid i{font-style:normal;color:var(--prav)}
  #zvok{background:none;border:1px solid var(--rob);color:var(--tiho);border-radius:50%;width:32px;height:32px;font-size:15px;cursor:pointer;line-height:1}
  #naslov{padding:0 14px;font-size:14px;color:var(--tiho)}
  #navodilo{padding:2px 14px 6px;font-size:17px;font-weight:600;min-height:2.4em}
  #odrsek{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 6px}
  svg{width:100%;height:100%;touch-action:none;display:block}

  .dres path{stroke:#06152b;stroke-width:.07}
  .dres text{font:700 .58px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .dres.duh{opacity:.5}
  .dres.premicen{cursor:grab}
  .dres.prav path{stroke:var(--prav);stroke-width:.16}
  .dres.narobe path{stroke:var(--narobe);stroke-width:.16}
  #oblacek g{opacity:0;transition:opacity .25s}
  #oblacek g.vidno{opacity:1}
  #oblacek rect{fill:var(--crta);stroke:#06152b;stroke-width:.08}
  #oblacek text{font:700 .6px system-ui,sans-serif;fill:#0a2a5e;text-anchor:middle;dominant-baseline:central}

  #razlaga{
    margin:0 14px 6px;display:flex;gap:10px;align-items:flex-start;
    max-height:32vh;overflow:auto;
  }
  #razlaga.skrit{display:none}
  #razlaga svg.glava{width:58px;height:58px;flex:0 0 58px;margin-top:2px}
  #razlaga .mehur{
    position:relative;background:var(--plosca);border:1px solid var(--rob);
    border-radius:12px;padding:10px 13px;font-size:14.5px;color:var(--besedilo);
  }
  #razlaga .mehur::before{
    content:"";position:absolute;left:-7px;top:16px;width:12px;height:12px;
    background:var(--plosca);border-left:1px solid var(--rob);border-bottom:1px solid var(--rob);

  }
  #razlaga .kdo{display:block;font-size:12px;color:var(--crta);font-weight:650;margin-bottom:3px}
  #kGumbi.stolpec{flex-direction:column}
  #kGumbi.stolpec button{width:100%;text-align:left}
  #dno{padding:6px 14px 14px;display:flex;align-items:center;gap:8px;min-height:58px}
  button.g{background:#16345c;border:1px solid var(--rob);color:var(--besedilo);border-radius:9px;padding:11px 16px;font:inherit;font-size:15px;cursor:pointer}
  button.g.glavni{background:var(--crta);border-color:#f0d287;color:#0a2a5e;font-weight:650}
  button.g:disabled{opacity:.35;cursor:default}
  button.g:active{transform:scale(.97)}
  button.g:focus-visible,#zvok:focus-visible{outline:2px solid var(--crta);outline-offset:2px}
  #stanje{color:var(--tiho);font-size:14px}
  .stresi{animation:stresi .4s}
  @keyframes stresi{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}

  #zaslon{position:fixed;inset:0;background:rgba(8,24,47,.94);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
  #zaslon.vidno{display:flex}
  #kartica{background:var(--plosca);border:1px solid var(--rob);border-radius:16px;padding:22px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
  #kartica h2{margin:0 0 6px;font-size:22px}
  #kartica p{margin:0 0 16px;color:var(--tiho);font-size:16px}
  #kartica .gumbi{display:flex;gap:8px;flex-wrap:wrap}
  .velika{font-size:40px;font-weight:700;color:var(--crta);line-height:1;margin:6px 0 14px}

  #izbor{position:fixed;inset:0;background:var(--ozadje);z-index:30;display:none;flex-direction:column;padding:16px}
  #izbor.vidno{display:flex}
  #izbor h2{margin:0 0 2px;font-size:21px}
  #izbor .pod{color:var(--tiho);font-size:15px;margin:0 0 12px}
  #seznam{flex:1;overflow-y:auto;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding-bottom:10px}
  .ime{background:#16345c;border:1px solid var(--rob);color:var(--besedilo);border-radius:999px;padding:9px 14px;font:inherit;font-size:15px;cursor:pointer}
  .ime.izbrana{background:var(--dres-obramba);color:var(--dres-obramba-tekst);border-color:#fff;font-weight:650}
  .ime:disabled{opacity:.35}
  #izborDno{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px solid var(--rob)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</div>

var ac = null;
function pisk(f, t, d){
  if(!zvokVklop) return;
  try{
    if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = t || "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.18, ac.currentTime + .01);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + (d||.18));
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + (d||.18) + .02);
  }catch(e){}
}

// igralni dan se začne ob 5:00
function igralniDan(){
  var d = new Date();
  if(d.getHours() < 5) d.setDate(d.getDate() - 1);
  return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
}
function stanjeIger(){
  try{
    var t = localStorage.getItem(KLJUC_IGRE);
    if(!t) return {dan: igralniDan(), n: 0};
    var o = JSON.parse(t);
    if(o.dan !== igralniDan()) return {dan: igralniDan(), n: 0};
    return o;
  }catch(e){ omejitevDela = false; return {dan: igralniDan(), n: 0}; }
}
function porabiIgro(){
  var o = stanjeIger();
  o.n++;
  try{ localStorage.setItem(KLJUC_IGRE, JSON.stringify(o)); }
  catch(e){ omejitevDela = false; }
  return o.n;
}
function preostaleIgre(){ return Math.max(0, NA_DAN - stanjeIger().n); }
function doNaslednje(){
  var d = new Date(), c = new Date();
  c.setHours(5,0,0,0);
  if(d.getHours() >= 5) c.setDate(c.getDate() + 1);
  var min = Math.round((c - d) / 60000);
  var ur = Math.floor(min / 60);
  return ur > 0 ? (ur + " ur " + (min % 60) + " minut") : (min + " minut");
}

function zoga(t){

function puscica(a, b, barva, konica, crtkano, debelina, odmik){
  // skrajšamo na obeh koncih, da konica ne sedi v dresu
  var dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
  if(d < .01) return;
  var ux = dx/d, uy = dy/d, r = odmik === undefined ? .95 : odmik;
  var x1 = a.x + ux*r, y1 = a.y + uy*r, x2 = b.x - ux*r, y2 = b.y - uy*r;
  if(Math.hypot(x2-x1, y2-y1) < .3) return;
  var l = document.createElementNS("http://www.w3.org/2000/svg","line");
  l.setAttribute("x1",x1); l.setAttribute("y1",y1);
  l.setAttribute("x2",x2); l.setAttribute("y2",y2);
  l.setAttribute("stroke", barva);
  l.setAttribute("stroke-width", debelina || .16);
  l.setAttribute("stroke-linecap","round");
  if(crtkano) l.setAttribute("stroke-dasharray",".45 .35");
  l.setAttribute("marker-end","url(#"+konica+")");
  gSledi.appendChild(l);
}

function sledi(odFaza, doFaza){
  gSledi.textContent = "";
  if(odFaza === doFaza) return;
  // pot žoge
  puscica(P(odFaza).ZOGA, P(doFaza).ZOGA, "var(--zoga)", "konicaZoga", true, .18, .7);
  // gibanje obrambe
  OBRAMBA.forEach(function(o){
    var a = P(odFaza)[o], b = P(doFaza)[o];
    if(Math.hypot(a.x-b.x, a.y-b.y) < .6) return;
    puscica(a, b, "#ffffff", "konica", false, .16);
  });
}

  var sx = Math.max(x + .6, Math.min(x + sirina - .6, t.x));
  var rep = document.createElementNS("http://www.w3.org/2000/svg","path");
  rep.setAttribute("d","M" + (sx - .45) + "," + (y + visina - .05) +

function pokrivaPivota(i){
  var p = P(i);
  // pivota pokriva osrednja branilka (mesto 4), razen kadar je šla v prostor
  if(Math.hypot(p.O4.x - p.PIV.x, p.O4.y - p.PIV.y) <= 2.5) return "O4";
  var naj = null, najd = 1e9;
  OBRAMBA.forEach(function(o){
    if(o === "O4") return;
    var d = Math.hypot(p[o].x - p.PIV.x, p[o].y - p.PIV.y);
    if(d < najd){ najd = d; naj = o; }
  });
  return naj;
}
function klici(i){
  var zdaj = pokrivaPivota(i), vrsta = [];
  var kdo = function(tarca){ return ime(DISKI[OBRAMBA.indexOf(tarca)]); };
  // kdo pokliče: tista, ki pivota predaja; če predaje ni, vodja obrambe (mesto 4)
  var p = prejsnja(i);
  var klicalec = (p !== null && pokrivaPivota(p) !== zdaj) ? pokrivaPivota(p) : "O4";
  if(klicalec !== zdaj) vrsta.push({tarca:klicalec, tekst: kdo(zdaj) + ", pivot!"});
  vrsta.push({tarca:zdaj, tekst: "Moj pivot!"});
  return vrsta;
}
function pokaziKlice(i){
  gOblacek.textContent = "";
  klici(i).forEach(function(k, n){

}

/* ============ animacija ============ */

function animiraj(cas, korak, konec){
  vAnimaciji = true;
  var t0 = null;
  function k(t){
    if(!t0) t0 = t;
    var d = Math.min(1,(t-t0)/cas);
    korak(d < .5 ? 2*d*d : 1-Math.pow(-2*d+2,2)/2);
    if(d < 1) requestAnimationFrame(k);
    else { vAnimaciji = false; if(konec) konec(); }
  }
  requestAnimationFrame(k);
}
function premakni(el, od, na, cas, konec){
  animiraj(cas, function(e){
    if(el) el.setAttribute("transform","translate("+(od.x+(na.x-od.x)*e)+","+(od.y+(na.y-od.y)*e)+")"
      + (el.dataset.id === "ZOGA" ? "" : " scale("+MERILO+")"));
  }, konec);
}

      "Tri igre na dan so porabljene. Nova igra bo na voljo čez " + doNaslednje() + ".\n\nTeorijo lahko gledaš, kolikor hočeš.",
      [{t:"Nazaj na teorijo", glavni:true, f:function(){ zapri(); zacniTeorijo(); }}]);
    return;
  }
  porabiIgro();
  nacin = "igra";
  golNapad = 0; golObramba = 0; krog = 0;
  var vse = [];
  PODATKI.faze.forEach(function(f, i){ if(prejsnja(i) !== null) vse.push(i); });
  krogi = vse.sort(function(){ return Math.random() - .5; }).slice(0,5);
  skrijRazlago();
  novKrog();
}

function novKrog(){
  faza = krogi[krog];
  oddano = false; ocena = {};
  gOblacek.textContent = ""; gSledi.textContent = "";
  document.getElementById("naslov").textContent = "Napad " + (krog+1) + " / " + krogi.length + " · " + PODATKI.faze[faza].ime;
  document.getElementById("navodilo").textContent = "Postavi obrambo, potem sproži napad.";
  document.getElementById("stanje").textContent = "";
  elLevo.textContent = "Ponastavi"; elLevo.disabled = false;
  elDesno.textContent = "Napad!";
  osveziPike(krog, krogi.length); osveziIzid();
  ponastaviPostavitev();
}

function ponastaviPostavitev(){
  delo = {};
  var pr = prejsnja(faza);
  DISKI.forEach(function(k,i){
    var t = P(pr)[OBRAMBA[i]];
    delo[k] = {x:t.x, y:t.y};
  });
  oddano = false; ocena = {};
  narisi();
}

// najboljše ujemanje dresov in mest (6! = 720 možnosti)
function ujemanje(){
  var naj = null, najVsota = 1e9;
  function rek(preostali, izbor, vsota){
    if(vsota >= najVsota) return;
    if(!preostali.length){ najVsota = vsota; naj = izbor.slice(); return; }
    for(var i = 0; i < preostali.length; i++){
      var o = preostali[i];
      var k = DISKI[izbor.length];
      var d = Math.hypot(delo[k].x - P(faza)[o].x, delo[k].y - P(faza)[o].y);
      var ostanek = preostali.slice(); ostanek.splice(i,1);
      izbor.push({disk:k, tarca:o, d:d});
      rek(ostanek, izbor, vsota + d);
      izbor.pop();
    }
  }
  rek(OBRAMBA.slice(), [], 0);
  return naj;
}

function napad(){
  if(vAnimaciji) return;
  var par = ujemanje();
  ocena = {};
  var napake = [];
  par.forEach(function(p){
    ocena[p.disk] = p.d <= tol();
    if(p.d > tol()) napake.push(p);
  });
  oddano = true;
  elDesno.disabled = true; elLevo.disabled = true;
  narisi();

  if(!napake.length){
    golObramba++;
    zvokPrav(); trese(40);
    document.getElementById("navodilo").textContent = "Obramba stoji. Napad nima kam.";
    blok(function(){ konecKroga("Obramba!", "Vsaka je na svojem mestu, prostora za podajo ni."); });
  }else{
    napake.sort(function(a,b){ return b.d - a.d; });
    var luknja = napake[0].tarca;
    golNapad++;
    document.getElementById("navodilo").textContent = "Luknja pri " + ime(napake[0].disk) + ".";
    gol(luknja, function(){
      konecKroga("Gol za napad", ime(napake[0].disk) + " ni bila na svojem mestu in napad je šel skozi to vrzel.");
    });
  }
  osveziIzid();
}

function prostaNapadalka(tarca){
  var p = P(faza), naj = null, najd = 1e9;
  NAPAD.forEach(function(a){
    var d = Math.hypot(p[tarca].x - p[a].x, p[tarca].y - p[a].y);
    if(d < najd){ najd = d; naj = a; }
  });
  return naj;
}

function gol(tarca, konec){
  var elZ = gDiski.querySelector('[data-id="ZOGA"]');
  var a = prostaNapadalka(tarca);
  premakni(elZ, P(faza).ZOGA, P(faza)[a], 450, function(){
    svg.classList.add("stresi");
    setTimeout(function(){ svg.classList.remove("stresi"); }, 420);
    zvokGol(); trese([60,50,60]);
    premakni(elZ, P(faza)[a], VRATA, 420, function(){ setTimeout(konec, 500); });
  });
}

function blok(konec){
  var elZ = gDiski.querySelector('[data-id="ZOGA"]');
  var p = P(faza);
  var cilj = {x:(p.PIV.x + p.ZOGA.x)/2, y:(p.PIV.y + p.ZOGA.y)/2};
  premakni(elZ, p.ZOGA, cilj, 380, function(){
    premakni(elZ, cilj, p.ZOGA, 380, function(){ setTimeout(konec, 400); });
  });
}

function konecKroga(naslov, besedilo){
  elDesno.disabled = false; elLevo.disabled = false;
  kartica(naslov + "   ·   Napad " + golNapad + " : " + golObramba + " Obramba",
    besedilo + "\n\n" + PODATKI.faze[faza].zakaj, [
    {t: krog < krogi.length-1 ? "Naslednji napad" : "Rezultat", glavni:true, f:function(){
      zapri();
      if(krog < krogi.length-1){ krog++; novKrog(); } else zacniKviz();
    }}
  ]);
}

function konecTekme(){
  zvokKonec();
  kartica(golObramba > golNapad ? "Obramba je zmagala" : (golObramba === golNapad ? "Neodločeno" : "Napad je zmagal"),
    "Napad " + golNapad + " : " + golObramba + " Obramba" +
    (omejitevDela ? ("\n\nDanes ti ostane " + preostaleIgre() + " iger.") : ""),
    [{t:"Še enkrat", glavni:true, f:function(){ zapri(); zacniIgro(); }},
     {t:"Nazaj na teorijo", f:function(){ zapri(); zacniTeorijo(); }},
     {t:"Druga ekipa", f:function(){ zapri(); ekipa = []; osveziSeznam(); elIzbor.classList.add("vidno"); }}],
    golNapad + " : " + golObramba);
}

/* ============ kviz ============ */

var kvizSet = [], kvizIdx = 0;

function zacniKviz(){
  kvizSet = VPRASANJA.slice().sort(function(){ return Math.random() - .5; }).slice(0,3);
  kvizIdx = 0;
  document.getElementById("naslov").textContent = "Vprašanja";
  document.getElementById("navodilo").textContent = "Tri vprašanja za konec.";
  skrijRazlago();
  vprasanje();
}

function vprasanje(){
  var q = kvizSet[kvizIdx];
  var vrstni = q.o.map(function(t, i){ return {t:t, prav: i === q.p}; })
                  .sort(function(){ return Math.random() - .5; });
  kartica("Vprašanje " + (kvizIdx+1) + " / 3", q.v,
    vrstni.map(function(m){
      return {t:m.t, f:function(){ odgovor(m.prav, q); }};
    }), undefined, true);
}

function odgovor(prav, q){
  if(prav){ golObramba++; zvokPrav(); trese(30); }
  else { golNapad++; zvokGol(); trese([50,60,50]); }
  osveziIzid();
  kartica(prav ? "Pravilno" : "Ni pravilno",
    prav ? "Točka za obrambo." : "Pravilen odgovor: " + q.o[q.p],
    [{t: kvizIdx < 2 ? "Naprej" : "Rezultat", glavni:true, f:function(){
      zapri();
      if(kvizIdx < 2){ kvizIdx++; vprasanje(); } else konecTekme();
    }}]);
}

/* ============ vlečenje ============ */

function vTocko(e){
  var m = svg.getScreenCTM().inverse();
  var p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(m);
}
svg.addEventListener("pointerdown", function(e){
  if(vAnimaciji || nacin !== "igra" || oddano) return;
  var g = e.target.closest(".dres.premicen");
  if(!g) return;
  vlecem = g.dataset.id;
  g.setPointerCapture(e.pointerId);
  e.preventDefault();
});
svg.addEventListener("pointermove", function(e){
  if(!vlecem) return;
  var t = vTocko(e);
  delo[vlecem] = {x: Math.max(.6, Math.min(19.4, t.x)), y: Math.max(.6, Math.min(13.6, t.y))};
  narisi();
});
function spusti(){ vlecem = null; }
svg.addEventListener("pointerup", spusti);
svg.addEventListener("pointercancel", spusti);

/* ============ gumbi in vrh ============ */

elLevo.addEventListener("click", function(){
  if(vAnimaciji) return;
  if(nacin === "teorija"){ if(slajdIdx > 0){ slajdIdx--; faza = slajdi[slajdIdx]; prikaziSlajd(); } }
  else ponastaviPostavitev();
});
elDesno.addEventListener("click", function(){
  if(vAnimaciji) return;
  if(nacin === "teorija"){
    if(slajdIdx < slajdi.length-1){ slajdIdx++; faza = slajdi[slajdIdx]; prikaziSlajd(); }
    else kartica("Konec teorije", "Zdaj pride napad. Postaviš obrambo, potem sprožiš napad in vidiš, kaj se zgodi.",
      [{t:"Začni igro", glavni:true, f:function(){ zapri(); zacniIgro(); }}]);
  }else napad();
});

function osveziPike(n, skupaj){
  var pike = document.getElementById("pike");
  pike.textContent = "";
  for(var i = 0; i < skupaj; i++){
    var s = document.createElement("span");
    s.className = i < n ? "done" : (i === n ? "now" : "");
    pike.appendChild(s);
  }
}
function osveziIzid(){
  document.getElementById("izid").innerHTML =
    "Napad <b>" + golNapad + "</b> : <i>" + golObramba + "</i> Obramba";
}

/* ============ kartica ============ */

var zaslon = document.getElementById("zaslon");
function kartica(naslov, besedilo, gumbi, velika, stolpec){
  document.getElementById("kNaslov").textContent = naslov;
  document.getElementById("kBesedilo").textContent = besedilo;
  var v = document.getElementById("kVelika");
  if(velika === undefined){ v.hidden = true; } else { v.hidden = false; v.textContent = velika; }
  var g = document.getElementById("kGumbi");
  g.className = "gumbi" + (stolpec ? " stolpec" : "");
  g.textContent = "";
  gumbi.forEach(function(b){
    var el = document.createElement("button");
    el.className = "g" + (b.glavni ? " glavni" : "");
    el.textContent = b.t;
    el.addEventListener("click", b.f);
    g.appendChild(el);
  });
  zaslon.classList.add("vidno");
}
function zapri(){ zaslon.classList.remove("vidno"); }

/* ============ zagon ============ */

narisiSeznam();
elIzbor.classList.add("vidno");

})();
</script>
</body>
